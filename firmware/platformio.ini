[env:sortcycle-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.4.2
; The board above is a build target only. Verify flash, USB and upload settings
; against your exact camera carrier before uploading. Default camera uses DRAM.
; If your board uses native USB serial, verify whether to add:
; build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1
